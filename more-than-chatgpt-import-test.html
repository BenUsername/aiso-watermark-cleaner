<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>More Than ChatGPT</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% 5%,#ffd49b66,transparent 30rem),radial-gradient(circle at 90% 10%,#9fd3c255,transparent 30rem),#f6f1e9;color:#1f2733}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:60px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#6c747c}h1{font-size:clamp(54px,7vw,88px);line-height:.95;letter-spacing:-.07em;margin:16px 0 22px}h1 span{color:#c85f49}p{font-size:18px;line-height:1.65;color:#5d6670}.art{position:relative;min-height:500px}.blob{position:absolute;width:390px;height:390px;right:10px;top:45px;border-radius:42% 58% 64% 36%/46% 40% 60% 54%;background:linear-gradient(145deg,#d8ebe5,#98c7be);box-shadow:25px 28px 45px #43756e30,inset 15px 15px 28px #ffffff7a,inset -15px -15px 28px #4c867c2e;transform:rotate(-8deg)}.card{position:absolute;padding:20px;border-radius:28px;background:#fffbf6ee;border:1px solid #ffffffcc;box-shadow:18px 22px 44px #4a3f3529,inset 3px 3px 9px #ffffffe6;display:grid;gap:7px;min-width:180px}.card strong{font-size:24px}.card small{color:#777066}.one{top:75px;left:0;transform:rotate(-5deg)}.two{right:0;top:230px;transform:rotate(4deg)}.three{left:80px;bottom:35px;transform:rotate(-2deg)}.icon{width:54px;height:54px;display:grid;place-items:center;border-radius:20px;font-size:26px;box-shadow:8px 10px 17px #4a3f3521,inset 4px 4px 9px #ffffffc2,inset -5px -5px 10px #5b4c4214}.yellow{background:linear-gradient(145deg,#ffe1a3,#f8b95b)}.peach{background:linear-gradient(145deg,#ffd4bd,#f79a75)}.lavender{background:linear-gradient(145deg,#e5ddf7,#b9a5e3)}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:60px 0}.art{min-height:430px}h1{font-size:58px}}</style></head><body><main class="hero wrap"><section><div class="eyebrow">Tel Aviv field notes</div><h1>The answer after the <span>generic answer.</span></h1><p>Real prices, locations, Friday opening quirks, bills and local workarounds that generic AI answers usually miss.</p></section><section class="art"><div class="blob"></div><div class="card one"><div class="icon yellow">🍺</div><strong>₪22</strong><small>Vedett pint</small></div><div class="card two"><div class="icon peach">◫</div><strong>Friday</strong><small>What is actually open?</small></div><div class="card three"><div class="icon lavender">⌁</div><strong>Arnona</strong><small>Decode the notice</small></div></section></main></body></html>
