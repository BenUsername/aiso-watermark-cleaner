name: Point More Than ChatGPT metadata to PNG

on:
  push:
    branches: [more-than-chatgpt-source]
    paths:
      - .github/workflows/update-more-than-chatgpt-og.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: more-than-chatgpt-source
      - name: Update social image metadata
        run: |
          sed -i 's#https://raw.githubusercontent.com/BenUsername/aiso-watermark-cleaner/more-than-chatgpt-source/public/more-than-chatgpt-og.svg#/more-than-chatgpt-og.png#g' public/more-than-chatgpt.html
      - name: Commit metadata update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/more-than-chatgpt.html
          git diff --cached --quiet || git commit -m "Use PNG share thumbnail [skip ci]"
          git push origin more-than-chatgpt-source
