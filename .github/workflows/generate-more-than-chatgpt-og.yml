name: Generate More Than ChatGPT thumbnail

on:
  push:
    branches: [more-than-chatgpt-source]
    paths-ignore:
      - public/more-than-chatgpt-og.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: more-than-chatgpt-source
      - name: Install SVG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Render PNG thumbnail
        run: rsvg-convert public/more-than-chatgpt-og.svg --width 1200 --height 630 --output public/more-than-chatgpt-og.png
      - name: Commit thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/more-than-chatgpt-og.png
          git diff --cached --quiet || git commit -m "Generate More Than ChatGPT thumbnail [skip ci]"
          git push origin more-than-chatgpt-source
