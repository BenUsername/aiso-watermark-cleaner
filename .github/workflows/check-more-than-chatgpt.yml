name: Check More Than ChatGPT public access

on:
  push:
    branches: [more-than-chatgpt-source]
    paths-ignore:
      - check-more-than-chatgpt-result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: more-than-chatgpt-source
      - name: Fetch Vercel deployment metadata
        shell: bash
        run: |
          set +e
          API_URL="https://api.vercel.com/v13/deployments/B7GoUj8vFkass2X1Fm8oeQkvyFEh"
          curl --max-time 30 -sS -D /tmp/headers.txt -o /tmp/body.txt -w '%{http_code}' "$API_URL" > /tmp/status.txt
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            echo "url=$API_URL"
            echo "status=$(cat /tmp/status.txt)"
            echo "body=$(head -c 5000 /tmp/body.txt | tr '\n' ' ' | tr '\r' ' ')"
          } > check-more-than-chatgpt-result.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-more-than-chatgpt-result.txt
          git diff --cached --quiet || git commit -m "Record More Than ChatGPT access check [skip ci]"
          git push origin more-than-chatgpt-source
