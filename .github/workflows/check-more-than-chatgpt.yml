name: Check More Than ChatGPT public access

on:
  push:
    branches: [more-than-chatgpt-source]
    paths-ignore:
      - check-more-than-chatgpt-result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: more-than-chatgpt-source
      - name: Fetch public preview URL
        shell: bash
        run: |
          set +e
          URL="https://aiso-watermark-cleaner-git-more-th-4f477a-bts-projects-abf9912d.vercel.app"
          curl -L --max-time 30 -sS -D /tmp/headers.txt -o /tmp/body.txt -w '%{http_code}' "$URL" > /tmp/status.txt
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            echo "url=$URL"
            echo "status=$(cat /tmp/status.txt)"
            echo "final_location=$(grep -i '^location:' /tmp/headers.txt | tail -1 | tr -d '\r' || true)"
            echo "title=$(grep -io '<title>[^<]*' /tmp/body.txt | head -1 | sed 's/<title>//I' || true)"
            echo "body_prefix=$(head -c 500 /tmp/body.txt | tr '\n' ' ' | tr '\r' ' ')"
          } > check-more-than-chatgpt-result.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-more-than-chatgpt-result.txt
          git diff --cached --quiet || git commit -m "Record More Than ChatGPT access check [skip ci]"
          git push origin more-than-chatgpt-source
